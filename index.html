<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1024">
<title>June Labs Apps</title>
<link rel="apple-touch-icon" href="june-arcade/icon.png">
<style>
  :root { --bg:#0f1024; --card:#1a1c3a; --line:#2c2f5a; --text:#fff; --dim:#9aa0c8; --blue:#3d8bff; --green:#3ddc84; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded",sans-serif; color:var(--text);
         background: radial-gradient(1200px 600px at 20% -10%, #3a2a80 0%, transparent 60%), radial-gradient(900px 500px at 110% 10%, #0b5a7a 0%, transparent 55%), var(--bg); }
  main { max-width:560px; margin:0 auto; padding: max(28px, env(safe-area-inset-top)) 16px 48px; }
  header { text-align:center; margin: 12px 0 26px; }
  header h1 { font-size:34px; margin:0; letter-spacing:-0.5px; }
  header p { color:var(--dim); margin:6px 0 0; }
  .app { display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:14px; margin-bottom:12px;
         text-decoration:none; color:inherit; animation: rise .5s both; }
  .app img { width:64px; height:64px; border-radius:15px; flex:none; box-shadow:0 6px 18px rgba(0,0,0,.35); background:#222; }
  .meta { flex:1; min-width:0; }
  .meta h2 { font-size:18px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta .tag { color:var(--dim); font-size:14px; margin:2px 0 4px; line-height:1.3; }
  .meta .when { font-size:12px; color:var(--dim); }
  .meta .new { color:var(--green); font-weight:600; }
  .get { flex:none; background:var(--blue); color:#fff; font-weight:700; border-radius:999px; padding:9px 18px; text-decoration:none; font-size:15px; }
  .get:active { opacity:.7; }
  .note { text-align:center; color:var(--dim); font-size:13px; margin-top:24px; line-height:1.5; }
  .desktop { display:none; background:#2a1f10; border:1px solid #5a4318; color:#ffd58a; border-radius:14px; padding:10px 14px; font-size:14px; margin-bottom:16px; text-align:center; }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } }
</style>
</head>
<body>
<main>
  <header><h1>June Labs</h1><p>Tap Get on your iPhone to install or update.</p></header>
  <div class="desktop" id="desktop">Open this page on your iPhone or iPad to install.</div>
  <div id="list"></div>
  <p class="note">After installing, the app appears on your home screen.<br>A new build replaces the old one; your saves stay.</p>
</main>
<script>
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (!ios) document.getElementById("desktop").style.display = "block";
  function ago(t) {
    const s = (Date.now() - new Date(t)) / 1000;
    if (s < 3600) return Math.max(1, Math.round(s / 60)) + " min ago";
    if (s < 86400) return Math.round(s / 3600) + " h ago";
    const d = Math.round(s / 86400); return d === 1 ? "yesterday" : d + " days ago";
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  fetch("apps.json?" + Date.now()).then(r => r.json()).then(apps => {
    apps.sort((a, b) => new Date(b.time) - new Date(a.time));
    document.getElementById("list").innerHTML = apps.map((a, i) => {
      const fresh = (Date.now() - new Date(a.time)) < 86400000;
      const install = "itms-services://?action=download-manifest&url=" + encodeURIComponent(location.href.replace(/[^/]*$/, "") + a.id + "/manifest.plist");
      return `<div class="app" style="animation-delay:${i * 60}ms">
        <a href="${a.id}/"><img src="${a.id}/icon.png" alt=""></a>
        <a class="meta" href="${a.id}/" style="text-decoration:none;color:inherit">
          <h2>${esc(a.name)}</h2><div class="tag">${esc(a.tagline || "")}</div>
          <div class="when">${fresh ? '<span class="new">Updated</span> ' : ''}${ago(a.time)}</div>
        </a>
        <a class="get" href="${install}">Get</a>
      </div>`;
    }).join("");
  });
</script>
</body>
</html>
